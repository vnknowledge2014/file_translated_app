<!DOCTYPE html>
<html lang="%lang%" dir="%dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- SEO -->
		<title>InfiTrans — AI Document Translation | Infinite Agent Lab</title>
		<meta name="description" content="Translate documents instantly with AI. Supports DOCX, XLSX, PPTX, PDF. Preserves formatting. Powered by Infinite Agent Lab." />
		<meta name="keywords" content="AI translation, document translation, DOCX, XLSX, machine translation, bilingual editor" />
		<link rel="canonical" href="/" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="InfiTrans — AI Document Translation" />
		<meta property="og:description" content="Upload documents, get instant AI translation with formatting preserved. Review with bilingual editor." />
		<meta property="og:site_name" content="InfiTrans" />

		<!-- Fonts: Geist (display) + Noto Sans JP (Japanese) -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
