services:
  # ── SurrealDB Database ──
  surrealdb:
    image: surrealdb/surrealdb:latest
    ports:
      - "8080:8000"
    volumes:
      - ./data/db:/data
    command: start --user root --pass root file:/data/surreal.db
    restart: unless-stopped

  # ── Translation App ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # Docker-specific overrides (these take priority over .env)
      - OLLAMA_URL=http://host.docker.internal:11434
      - SURREALDB_URL=ws://surrealdb:8000/rpc
      - SURREALDB_USER=root
      - SURREALDB_PASS=root
      - SURREALDB_NS=translate
      - SURREALDB_DB=mvp
      - UPLOAD_DIR=/data/uploads
      - OUTPUT_DIR=/data/output
      - TEMP_DIR=/data/temp
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/api/health'); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - surrealdb

