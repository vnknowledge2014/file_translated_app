services:
  # ── MinIO Object Storage ──
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"  # Console — localhost only
    volumes:
      - ./data/minio:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── SurrealDB Database ──
  surrealdb:
    image: surrealdb/surrealdb:latest
    ports:
      - "8080:8000"
    volumes:
      - ./data/db_v3:/data
    # Use environment variables for authentication to avoid committing secrets
    command: start --user ${SURREALDB_USER:-root} --pass ${SURREALDB_PASS:-root} surrealkv:///data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/surreal", "is-ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Translation App ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      # Docker-specific overrides (these take priority over .env)
      - OLLAMA_URL=http://host.docker.internal:11434
      - SURREALDB_URL=ws://surrealdb:8000/rpc
      - SURREALDB_USER=${SURREALDB_USER:-root}
      - SURREALDB_PASS=${SURREALDB_PASS:-root}
      - SURREALDB_NS=translate
      - SURREALDB_DB=mvp
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - TEMP_DIR=/data/temp
      - SECRET_KEY=${SECRET_KEY:-mvp_dev_secret_key_change_in_production}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/api/health'); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      surrealdb:
        condition: service_healthy
      minio:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: infitrans
