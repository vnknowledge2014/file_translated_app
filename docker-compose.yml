services:
  # ── Translation App ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./frontend:/app/frontend:ro
    environment:
      # Docker-specific overrides (these take priority over .env)
      - OLLAMA_URL=http://host.docker.internal:11434
      - DATABASE_URL=sqlite:///data/db/translations.db
      - UPLOAD_DIR=/data/uploads
      - OUTPUT_DIR=/data/output
      - TEMP_DIR=/data/temp
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/api/health'); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

